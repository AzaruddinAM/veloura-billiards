name: CI / Deploy

# Every push and pull request: lint PHP, build the Angular app, assemble release/,
# and run an end-to-end API smoke test against it.
# Pushes to main then deploy release/ to Hostinger over FTPS — once the FTP secrets are set
# (see README → "Continuous deployment").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_slate:
        description: 'Delete EVERYTHING in the server folder first (including data/ — the live SQLite database), then upload a fresh copy'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql
          coverage: none

      - name: Lint PHP
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build release (Angular production build + PHP API)
        run: bash build-release.sh

      - name: Smoke test (app, auth, timers, billing, accounts, month end, roles)
        run: bash .github/scripts/smoke-test.sh release

      - name: Upload release bundle
        uses: actions/upload-artifact@v5
        with:
          name: veloura-billiards-release
          path: release/
          include-hidden-files: true   # keep the .htaccess files
          retention-days: 14

  deploy:
    name: Deploy to billiards.velouraone.in
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://billiards.velouraone.in
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Each setting may be stored as a repository/environment Secret or Variable.
      # Only names are ever printed — never values.
      - name: Check deployment settings
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR }}
          PASSWORD_AS_VARIABLE: ${{ vars.FTP_PASSWORD != '' }}
        run: |
          missing=()
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -n "${!name}" ]; then echo "✓ $name is set"; else echo "✗ $name is missing"; missing+=("$name"); fi
          done
          if [ "$PASSWORD_AS_VARIABLE" = "true" ]; then
            echo "::warning title=FTP_PASSWORD is a Variable::Variables are visible to anyone who can read the repo settings. Delete it and add FTP_PASSWORD under the Secrets tab instead."
          fi
          if [ ${#missing[@]} -eq 0 ]; then
            if [ -n "$FTP_SERVER_DIR" ]; then
              dir="${FTP_SERVER_DIR#/}"; [[ "$dir" == */ ]] || dir="$dir/"
              echo "✓ FTP_SERVER_DIR is set"
              echo "DEPLOY_DIR=$dir" >> "$GITHUB_ENV"
            else
              echo "· FTP_SERVER_DIR not set — the next step will look for the subdomain folder"
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Missing in Settings → Secrets and variables → Actions: ${missing[*]}"
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true' && env.DEPLOY_DIR == ''
        with:
          sparse-checkout: .github/scripts

      - name: Find the subdomain folder on the server
        if: steps.cfg.outputs.ready == 'true' && env.DEPLOY_DIR == ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash .github/scripts/find-ftp-dir.sh

      - name: Download release bundle
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/download-artifact@v5
        with:
          name: veloura-billiards-release
          path: release

      - name: Upload to Hostinger over FTPS
        if: steps.cfg.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: release/
          # Folder on the server that holds .htaccess, public/, src/, data/… (the subdomain folder) — must end with a slash.
          server-dir: ${{ env.DEPLOY_DIR }}
          # Normal deploys never touch the live database or the server-only config.
          exclude: |
            **/data/*.sqlite*
            **/config.local.php
          # Manual runs can wipe the folder first (Actions → CI / Deploy → Run workflow → clean slate).
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_slate }}
          log-level: standard

      - name: Check the live site
        if: steps.cfg.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://billiards.velouraone.in/ || true)
          echo "https://billiards.velouraone.in/ answered HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning title=Site not reachable yet::Files were uploaded, but the site answered '$code'. Check DNS and the subdomain's document root."
          fi
